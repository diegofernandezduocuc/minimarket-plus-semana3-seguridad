spring.application.name=minimarket
server.port=8080

spring.datasource.url=jdbc:h2:mem:minimarketdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

app.jwt.secret=minimarketPlusJwtSecretKeyLocalDevelopment1234567890
app.jwt.expiration-ms=3600000

logging.level.com.minimarket.security=INFO
logging.level.org.springframework.security=INFO
